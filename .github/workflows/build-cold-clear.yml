name: Build Cold Clear WebAssembly

on:
  pull_request:
    paths:
      - "game.js"
      - "cold-clear/main-worker.js"
      - "cold-clear/worker.js"
      - ".github/workflows/build-cold-clear.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cold-clear-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile original Cold Clear engine for the browser
    runs-on: ubuntu-latest
    steps:
      - name: Check out the game branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true

      - name: Install stable Rust and the WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Fetch and prepare the pinned original Cold Clear source
        env:
          COLD_CLEAR_REV: "279edd7c3177ff8077f6a930193397814b281f27"
        run: |
          git clone --filter=blob:none https://github.com/MinusKelvin/cold-clear.git "$RUNNER_TEMP/cold-clear"
          git -C "$RUNNER_TEMP/cold-clear" checkout --detach "$COLD_CLEAR_REV"
          python - "$RUNNER_TEMP/cold-clear/tbp/src/lib.rs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text()
          old = """                let options = cold_clear::Options {
                    speculate: matches!(randomizer, RandomizerState::SevenBag { .. }),
                    ..Default::default()
                };"""
          new = """                let options = cold_clear::Options {
                    speculate: matches!(randomizer, RandomizerState::SevenBag { .. }),
                    // TBP v1.0 does not report hold usage in its suggestion.
                    use_hold: false,
                    // Bound background work so the browser worker stays responsive.
                    max_nodes: 250_000,
                    ..Default::default()
                };"""
          if source.count(old) != 1:
              raise SystemExit("Expected Cold Clear TBP Options block was not found exactly once")
          path.write_text(source.replace(old, new))
          PY

      - name: Build the original Cold Clear Tetris Bot Protocol adapter
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo build --manifest-path "$RUNNER_TEMP/cold-clear/Cargo.toml" --release --target wasm32-unknown-unknown -p cc-tbp

      - name: Install the matching wasm-bindgen CLI
        run: |
          VERSION="$(cargo tree --manifest-path "$RUNNER_TEMP/cold-clear/Cargo.toml" --target wasm32-unknown-unknown -p cc-tbp -i wasm-bindgen --depth 0 | sed -n 's/^wasm-bindgen v//p' | head -n 1)"
          test -n "$VERSION"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Generate browser worker bindings
        run: |
          wasm-bindgen --target no-modules --out-dir "$GITHUB_WORKSPACE/cold-clear" --out-name cc_tbp "$RUNNER_TEMP/cold-clear/target/wasm32-unknown-unknown/release/cc_tbp.wasm"
          test -s cold-clear/cc_tbp.js
          test -s cold-clear/cc_tbp_bg.wasm
          grep -q "_web_worker_entry_point" cold-clear/cc_tbp.js
          grep -q "start" cold-clear/cc_tbp.js
          node --check cold-clear/cc_tbp.js
          node --check cold-clear/main-worker.js
          node --check cold-clear/worker.js
          node --check game.js

      - name: Commit the generated WebAssembly runtime to the pull request
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build Cold Clear WebAssembly runtime"
          file_pattern: "cold-clear/cc_tbp.js cold-clear/cc_tbp_bg.wasm cold-clear/cc_tbp.d.ts"
