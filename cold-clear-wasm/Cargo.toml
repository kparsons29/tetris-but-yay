[package]
name = "stacklab-cold-clear"
version = "0.1.0"
edition = "2018"

[lib]
name = "cc_tbp"
crate-type = ["cdylib", "rlib"]

[dependencies]
# This is the original Cold Clear engine revision used by the upstream
# Cold Clear WebAssembly client.
cold-clear = { git = "https://github.com/MinusKelvin/cold-clear.git", rev = "7cb2f8d" }
libtetris = { git = "https://github.com/MinusKelvin/cold-clear.git", rev = "7cb2f8d" }
futures = "0.3.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.65"
wasm-bindgen-futures = "=0.4.15"

[dependencies.web-sys]
version = "0.3.42"
features = [
  "DedicatedWorkerGlobalScope",
  "MessageEvent"
]
